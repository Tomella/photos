<!doctype html>
<html lang=en>

<head>
    <meta charset=utf-8>
    <meta content="width=device-width,initial-scale=1" name="viewport">
    <meta name="description" content="Photo album that shows geolocation on map.">
    <title>Photo Album</title>
    <link rel="icon" type="image/png" href="../icon.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/leaflet.js"
        integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hOEQiglfqkJs1NOQV44cWnUrBc8PkAOcXy20w0vlaXaVUearIOBhiXZ5V3ynxwA=="
        crossorigin="anonymous"></script>
    <script type="module" src="components/ph-cog.js"></script>
    <script type="module" src="components/ph-globe.js"></script>
    <script type="module" src="components/ph-download.js"></script>
    <script type="module" src="components/ph-map.js"></script>
    <script type="module" src="components/ph-modal.js"></script>
    <script type="module" src="components/ph-keyword.js"></script>
    <script type="module" src="components/ph-key.js"></script>
    <script type="module" src="components/ph-trash.js"></script>
    <script type="module" src="components/qr-code.js"></script>
    <script type="module" src="components/ph-navigation.js"></script>
    <script type="module" src="album/component/al-expand-image.js"></script>
    <script type="module" src="album/component/al-image-container.js"></script>
    <script type="module" src="album/component/al-image.js"></script>
    <script type="module" src="album/component/al-magnify.js"></script>
    <link rel="stylesheet" href="album/album.css" />
</head>

<body>
    <div>
        <h1><a title="Return to the Home Page" href="/" style="text-decoration: none;">&lt;&nbsp;</a>&nbsp;<span id="album-title">Select an Album.</span></h1>
        <h4>Photo Album</h4>
        <qr-code title="Share this Album via a QR Code"></qr-code>
        <ph-cog title="Share this Album via a QR Code"></ph-cog>
    </div>
    <div id="select-album">
        <button role="button" title="Choose an Album to view" class="select-label">Select Album...</button>
    </div>
    <div id="keyword-container">
        View Album
        <span class="filter-container">
            <input class="filter-input" type="text" placeholder="Filter..."></input>
            <button disabled class="select-close">X</button>
        </span>
        <div class="keywords">
            Loading album names...
        </div>
    </div>
    <al-image-container></al-image-container>
    <al-expand-image hidden></al-expand-image>
    <ph-map hidden></ph-map>
    <ph-modal id="deletePhoto" title="Confirm deletion of photo">
        <div>Are you sure you want to delete this photo?</div>
        <br/>
        <button id="deletePhotoNo" class="ph-modal-button">No</button>
        <button id="deletePhotoYes" class="ph-modal-button">Yes</button>
    </ph-modal>
</body>
<script type="module" src="album/album.js"></script>

</html>
